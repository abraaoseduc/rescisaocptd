<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Rescisão - SEDUC</title>
    <!-- Inclua aqui seus arquivos de estilo CSS, se houver -->
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; max-width: 400px; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; cursor: pointer; background-color: #0056b3; color: white; border: none; border-radius: 4px; }
        button:disabled { background-color: #cccccc; }
    </style>
</head>
<body>

    <h2>Lançamento de Rescisão</h2>

    <form id="formRescisao" onsubmit="event.preventDefault(); processarEnvio();">
        <div class="form-group">
            <label for="crede">CREDE:</label>
            <input type="text" id="crede" placeholder="Ex: CREDE 01" required>
        </div>

        <div class="form-group">
            <label for="matricula">Matrícula:</label>
            <input type="text" id="matricula" placeholder="Ex: 12345678" required>
        </div>

        <div class="form-group">
            <label for="nome">Nome do Servidor:</label>
            <input type="text" id="nome" placeholder="Nome Completo" required>
        </div>

        <div class="form-group">
            <label for="rubrica">Rubrica:</label>
            <input type="text" id="rubrica" placeholder="Ex: 001 - Férias Proporcionais" required>
        </div>

        <div class="form-group">
            <label for="tipoLancamento">Tipo de Lançamento:</label>
            <select id="tipoLancamento" required>
                <option value="">Selecione...</option>
                <option value="Provento">Provento</option>
                <option value="Desconto">Desconto</option>
            </select>
        </div>

        <div class="form-group">
            <label for="valorTotal">Valor Total (R$):</label>
            <input type="number" step="0.01" id="valorTotal" placeholder="0.00" required>
        </div>

        <div class="form-group">
            <label for="observacao">Observação:</label>
            <textarea id="observacao" rows="3" placeholder="Observações adicionais..."></textarea>
        </div>

        <button type="submit">📊 Enviar para Planilha</button>
    </form>

    <!-- Frame oculto obrigatório para recepção do envio autenticado -->
    <iframe name="hidden_iframe_gsheet" id="hidden_iframe_gsheet" style="display:none;"></iframe>

    <!-- Importação do arquivo de scripts de utilidade -->
    <script src="util.js"></script>

    <script>
        function processarEnvio() {
            const payload = {
                crede: document.getElementById('crede').value,
                matricula: document.getElementById('matricula').value,
                nome: document.getElementById('nome').value,
                rubrica: document.getElementById('rubrica').value,
                tipoLancamento: document.getElementById('tipoLancamento').value,
                valorTotal: parseFloat(document.getElementById('valorTotal').value) || 0,
                observacao: document.getElementById('observacao').value
            };

            enviarRescisaoPlanilha(payload);
        }
    </script>
</body>
</html>
